name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          ./gradlew --no-daemon --stacktrace testFullDebugUnitTest 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E -A3 "^e: |What went wrong|Caused by|OutOfMemory|Execution failed" test.log | grep -v "^--$" | head -30 | while IFS= read -r line; do echo "::error::$line"; done
            python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob("app/build/test-results/**/*.xml", recursive=True):
              for tc in ET.parse(f).getroot().iter("testcase"):
                  for fail in list(tc.findall("failure")) + list(tc.findall("error")):
                      msg = (fail.get("message") or fail.text or "").strip().splitlines()[0][:400]
                      print(f"::error::{tc.get('classname')}.{tc.get('name')}: {msg}")
          PY
            exit "$status"
          fi

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Build APKs
        run: |
          ./gradlew --no-daemon --stacktrace assembleFullDebug assembleFullRelease assembleLiteRelease 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E -A3 "^e: |What went wrong|Caused by|OutOfMemory|Execution failed" build.log | grep -v "^--$" | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit "$status"
          fi

      - name: Verify permissions
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          for apk in app/build/outputs/apk/*/release/*.apk; do
            if $AAPT dump permissions "$apk" | grep -q "android.permission.INTERNET"; then
              echo "INTERNET permission found in $apk"; exit 1
            fi
          done
          LITE=$(ls app/build/outputs/apk/lite/release/*.apk)
          if $AAPT dump xmltree --file AndroidManifest.xml "$LITE" | grep -qE "BIND_ACCESSIBILITY_SERVICE|BIND_NOTIFICATION_LISTENER_SERVICE"; then
            echo "Lite APK must not declare accessibility or notification-listener services"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: gromp-apk
          path: app/build/outputs/apk/**/*.apk
