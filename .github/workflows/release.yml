name: Release

# Publishes a release whenever versionName in app/build.gradle.kts is new.
# Re-running is safe: versions that already have a release are skipped.
on:
  push:
    branches: [ main ]
    paths: [ 'app/build.gradle.kts', '.github/workflows/release.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.v.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        if: steps.v.outputs.skip != 'true'

      - name: Test and build
        if: steps.v.outputs.skip != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.GROMP_KEYSTORE_BASE64 }}
          GROMP_KEYSTORE_PASSWORD: ${{ secrets.GROMP_KEYSTORE_PASSWORD }}
          GROMP_KEY_ALIAS: ${{ secrets.GROMP_KEY_ALIAS }}
          GROMP_KEY_PASSWORD: ${{ secrets.GROMP_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/gromp.jks"
            export GROMP_KEYSTORE="$RUNNER_TEMP/gromp.jks"
          else
            echo "::warning::No signing secrets set; release APKs use the shared development key."
          fi
          { ./gradlew --no-daemon testFullDebugUnitTest && ./gradlew --no-daemon --stacktrace assembleFullRelease assembleLiteRelease; } 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E -A3 "^e: |What went wrong|Caused by|OutOfMemory|Execution failed" build.log | grep -v "^--$" | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit "$status"
          fi

      - name: Verify permissions
        if: steps.v.outputs.skip != 'true'
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          for apk in app/build/outputs/apk/*/release/*.apk; do
            if $AAPT dump permissions "$apk" | grep -q "android.permission.INTERNET"; then
              echo "INTERNET permission found in $apk"; exit 1
            fi
          done
          LITE=$(ls app/build/outputs/apk/lite/release/*.apk)
          if $AAPT dump xmltree --file AndroidManifest.xml "$LITE" | grep -qE "BIND_ACCESSIBILITY_SERVICE|BIND_NOTIFICATION_LISTENER_SERVICE"; then
            echo "Lite APK must not declare accessibility or notification-listener services"; exit 1
          fi

      - name: Name the APK
        if: steps.v.outputs.skip != 'true'
        run: |
          VERSION=${{ steps.v.outputs.version }}
          cp app/build/outputs/apk/full/release/app-full-release.apk "gromp-$VERSION-full.apk"
          cp app/build/outputs/apk/lite/release/app-lite-release.apk "gromp-$VERSION-lite.apk"
          sha256sum gromp-$VERSION-*.apk > "gromp-$VERSION.sha256"

      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.skip != 'true'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Gromp ${{ steps.v.outputs.version }}
          files: |
            gromp-*.apk
            gromp-*.sha256
          body: |
            Fully offline. No internet permission, no account, no analytics.

            **Which APK?** (Android 9 or newer)
            - `gromp-*-lite.apk`: dashboard, trends and insights. Installs straight from your phone's browser.
            - `gromp-*-full.apk`: adds soft locks and notification counting. These need Accessibility and notification access, which Play Protect blocks for browser-downloaded apps in some regions (including India). Install it from a computer with `adb install gromp-*-full.apk`.

            **In this release**
            - Today dashboard: screen time vs your limit, pace vs your usual day, pickups, first pickup, longest session, notifications, hour-by-hour chart, top apps
            - Trends: week / month / year, 7×24 heatmap, time by category
            - App detail with visit lengths and a 30-day trend
            - Insights from simple on-device rules, goal days without streak guilt
            - Soft locks: breathe-before-opening pause, daily limits, focus hours
            - Category limits: one shared daily limit for Social, Video, Games and more (Full edition)
            - Smart nudges: the real cost of your time, "was it worth it?" ratings, weak-spot heads-ups, goals that taper, and a Sunday review
            - Live check-ins (Full edition): "what are you here for?", drift, binge and scroll-loop check-ins, in a Gentle, Honest or Tough love tone
            - JSON backup export / restore, delete everything

            **First run:** grant Usage access. For locks, turn on *Gromp locks* in Accessibility settings. On Xiaomi, Oppo, Vivo, Realme and Samsung, allow background activity / Autostart for Gromp.

            Export a backup in Settings before switching editions or reinstalling.
